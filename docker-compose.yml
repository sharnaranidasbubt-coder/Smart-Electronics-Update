version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: smart-electronics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: local
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - wordpress-network
    ports:
      - "5001:3306"
    command: --default-authentication-plugin=mysql_native_password

  wordpress:
    image: ranidas26/sonysmartelctronics:v1
    container_name: smart-electronics-wordpress
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "5000:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: local
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
    networks:
      - wordpress-network
    volumes:
      - ./app/public/wp-content:/var/www/html/wp-content

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smart-electronics-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "5002:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    networks:
      - wordpress-network

networks:
  wordpress-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local