services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: smart-electronics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: local
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - wordpress-network
    command: --default-authentication-plugin=mysql_native_password

  # WordPress with PHP-FPM
  wordpress:
    image: wordpress:6.7-php8.2-fpm
    container_name: smart-electronics-wordpress
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: local
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
    volumes:
      - ./app/public:/var/www/html:cached
      - ./conf/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - wordpress-network

  # Nginx Web Server
  nginx:
    image: nginx:1.27-alpine
    container_name: smart-electronics-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    volumes:
      - ./app/public:/var/www/html:cached
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - wordpress-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smart-electronics-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    networks:
      - wordpress-network

networks:
  wordpress-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
